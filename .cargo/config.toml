# rustc runs with cwd = workspace root, so paths here are root-relative.
[target.x86_64-unknown-none]
rustflags = [
    "-C", "relocation-model=static",
    # The kernel links at PHYS_OFFSET (0xFFFF8000...): the small code model
    # would emit 32-bit relocations that cannot reach it.
    "-C", "code-model=large",
    "-C", "link-arg=-no-pie",
]

[target.riscv64gc-unknown-none-elf]
rustflags = [
    # Physical load address first, then (from M9.1b) the Sv39 high half:
    # rustc's generic "medium" maps to LLVM medany and reaches both.
    "-C", "code-model=medium",
    "-C", "link-arg=-no-pie",
]
