[package]
name = "kernel-aarch64"
version = "0.0.4"
edition = "2021"
description = "fantuan kernel — aarch64 direct-FDT (M11 R9a)"

[dependencies]
fantuan-abi = { path = "../abi" }
kernel-core = { path = "../kernel-core" }
# Optional (R9b): the rump network stack is only linked when CONFIG_NET=y.
# tools/build.sh passes --features kconfig-net from .config.
kernel-net = { path = "../kernel-net", optional = true }

[features]
kconfig-net = ["dep:kernel-net"]
