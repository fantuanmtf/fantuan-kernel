[package]
name = "fantuan-kernel"
version = "0.0.2"
edition = "2021"
description = "fantuan-kernel core (M0)"

[dependencies]
fantuan-abi = { path = "../abi" }
kernel-core = { path = "../kernel-core" }
# Optional (C4): the rump network stack is only linked when CONFIG_NET=y.
# tools/build.sh / build-bios.sh pass --features kconfig-net from .config.
kernel-net = { path = "../kernel-net", optional = true }

[features]
kconfig-net = ["dep:kernel-net"]

[build-dependencies]
cc = "1"
